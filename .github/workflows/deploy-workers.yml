name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'assets/basket.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `npm test` only runs the pure/offline unit tests — the other `npm run
      # test:*` scripts hit live services and need locally-stored secrets, so
      # they stay manual-only (see package.json).
      - name: Run unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - uses: actions/checkout@v4

      - name: Deploy checkout worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          wranglerVersion: '3'

      - name: Deploy webhook worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          wranglerVersion: '3'
          command: deploy --config wrangler-webhook.toml

      - name: Deploy tracking notifier worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          wranglerVersion: '3'
          command: deploy --config wrangler-tracking-notifier.toml
